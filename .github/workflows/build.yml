name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple-silicon runners were out of capacity on 2026-11-06; the Intel pool builds the same arm64 IPA.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash scripts/build.sh

      - name: Build Safari userscript
        run: bash scripts/make-userscript.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: PBTouch-ipa
          path: build/PBTouch.ipa

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/PBTouch.ipa dist/pb-touch.user.js \
            --title "PB Touch — latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. PBTouch.ipa is unsigned: sign and install it with your usual sideloading tool. No sideloading? Use pb-touch.user.js in Safari with the free Userscripts extension (see README)." \
            --prerelease
